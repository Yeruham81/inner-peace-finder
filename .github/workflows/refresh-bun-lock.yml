name: Refresh Bun lockfile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Bun 1.2.22
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Regenerate bun.lock
        run: bun install --lockfile-only

      - name: Verify Lovable is absent from dependency files
        shell: bash
        run: |
          if grep -Eqi '@lovable\.dev|lovable-core-prod' package.json bun.lock bunfig.toml; then
            echo "Lovable reference still exists in package.json, bun.lock, or bunfig.toml"
            grep -Ein '@lovable\.dev|lovable-core-prod' package.json bun.lock bunfig.toml || true
            exit 1
          fi

      - name: Verify regenerated lockfile is frozen-clean
        run: bun install --frozen-lockfile

      - name: Upload regenerated bun.lock
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock
          path: bun.lock
          if-no-files-found: error
